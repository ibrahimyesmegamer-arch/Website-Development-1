<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist Sorter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container py-4">

        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted  mb-4">Sort and label your music playlist using JavaScript array methods!</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-titles">Song names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A-Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z-A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-titles">Play Counts</h3>
                <button class="btn btn-primary mr-2" onclick="sortLeast()">Least played first</button>
                <button class="btn btn-primary" onclick="sortMost()">Most played first</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-titles">Label every Play Count</h3>
                <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>


    </div>
    <script>

        var songs = ["Zoom", "Bounce", "Glow", "Rush", "Spark"];
        var plays = [320, 85, 210, 50, 175];

        document.getElementById("nameResult").innerHTML = "Songs :" + songs;
        document.getElementById("countResult").innerHTML = "Plays :" + plays;
        document.getElementById("labelResult").innerHTML = "Press the button above!";

        function sortAZ() { songs.sort(); document.getElementById("nameResult").innerHTML = "A-Z :" + songs; }
        function sortZA() { songs.sort(); songs.reverse(); document.getElementById("nameResult").innerHTML = "Z-A :" + songs; }

        function sortLeast() {
            plays.sort(function (a, b) { return a - b; });
            document.getElementById("countResult").innerHTML = "Least played first: " + plays;
        }

        function sortMost() {
            plays.sort(function (a, b) { return b - a; });
            document.getElementById("countResult").innerHTML = "Most played first: " + plays;
        }

        function addLabel() {
            var l = plays.map(function (c) { return c + " plays :"; });
            document.getElementById("labelResult").innerHTML = "Labelled: " + l;
        }

    </script>
</body>

</html>
