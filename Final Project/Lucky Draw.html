<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Lucky Draw</h1>
    <p>enter a name, and guess to win!</p>

    <input type="text" id="name" placeholder="Your name" required><br>

    <p id="message-name"></p>

    <input type="number" id="guess" placeholder="Guess a number (1 - 5)" min="1" max="5" required><br>
    <p id="message-guess"></p>

    <button onClick="checkForm()">Try my luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>

        var seconds = 0;
        setInterval(function () {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "You have been here for " + seconds + " seconds!";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if (name == "") {
                document.getElementById("message-name").textContent = "Please enter your name!";
                document.getElementById("message-name").style.color = "red";

            } else {
                document.getElementById("message-name").textContent = "Great name!";
                document.getElementById("message-name").style.color = "green";
            }

            if (guess == "") {
                document.getElementById("message-guess").textContent = "Please enter your guess!";
                document.getElementById("message-guess").style.color = "red";

            } else {
                document.getElementById("message-guess").textContent = "Guess saved!";
                document.getElementById("message-guess").style.color = "green";
            }

            if (ok == true) {
                var lucky = Math.floor(Math.random() * 5) + 1;
                if (guess == lucky) {
                    document.getElementById("result").textContent = "You win, " + name + "! The lucky number was " + lucky + "!";
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").textContent = "So close, " + name + "! The lucky number was " + lucky + ". Try again!";
                    document.getElementById("result").style.color = "red";
                }
            }
        }
    </script>
</body>

</html>
