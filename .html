<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Memory Puzzle</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin-top: 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .info {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            width: 80px;
            height: 80px;
            background-color: #34495e;
            border: 2px solid #7f8c8d;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
            user-select: none;
        }

        /* Hide the emoji text initially by making it transparent */
        .card span {
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Show emoji when flipped */
        .card.flipped {
            background-color: #ecf0f1;
            transform: scale(1.05);
        }

        .card.flipped span {
            opacity: 1;
        }

        /* Styling for matched cards */
        .card.matched {
            background-color: #2ecc71;
            border-color: #27ae60;
            cursor: default;
        }

        .card.matched span {
            opacity: 1;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #e74c3c;
            color: white;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

    <h1>Memory Puzzle</h1>
    <div class="info">Moves: <span id="move-count">0</span></div>

    <div class="game-board" id="board"></div>

    <button onclick="initGame()">Restart Game</button>

    <script>
        const emojis = ['🚀', '🎮', '🍕', '🎸', '👾', '🏀', '⭐', '🔥'];
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;

        const board = document.getElementById('board');
        const moveCountDisplay = document.getElementById('move-count');

        // Function to start or reset the game
        function initGame() {
            board.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            moveCountDisplay.innerText = moves;

            // Duplicate emojis to make pairs and shuffle them
            cards = [...emojis, ...emojis];
            cards.sort(() => Math.random() - 0.5);

            // Create card elements
            cards.forEach((emoji, index) => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                cardElement.dataset.index = index;

                const spanElement = document.createElement('span');
                spanElement.innerText = emoji;

                cardElement.appendChild(spanElement);
                cardElement.addEventListener('click', () => flipCard(cardElement, emoji));
                board.appendChild(cardElement);
            });
        }

        // Function to handle card clicks
        function flipCard(cardElement, emoji) {
            // Ignore clicks if 2 cards are already flipped, or if clicking an already flipped/matched card
            if (flippedCards.length === 2 || cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) {
                return;
            }

            cardElement.classList.add('flipped');
            flippedCards.push({ element: cardElement, emoji: emoji });

            if (flippedCards.length === 2) {
                moves++;
                moveCountDisplay.innerText = moves;
                checkForMatch();
            }
        }

        // Function to check if the two flipped cards match
        function checkForMatch() {
            const [card1, card2] = flippedCards;

            if (card1.emoji === card2.emoji) {
                // It's a match
                card1.element.classList.replace('flipped', 'matched');
                card2.element.classList.replace('flipped', 'matched');
                matchedPairs++;
                flippedCards = [];

                if (matchedPairs === emojis.length) {
                    setTimeout(() => alert(`You won in ${moves} moves! 🎉`), 300);
                }
            } else {
                // Not a match, flip them back after a short delay
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        // Start the game when the page loads
        initGame();
    </script>
</body>

</html>
